name: Verify reusable template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/verify_template.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run unchanged public regression and learning-contract tests
        working-directory: examples/tcg-agent
        run: node --test tests/*.test.mjs
      - name: Confirm full Standard remains gated
        run: python -c "import subprocess, sys; result = subprocess.run([sys.executable, 'scripts/verify_template.py', '--require-full-standard']); sys.exit(0 if result.returncode == 2 else 1)"
